name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: multi-cloud-app:${{ github.sha }}

jobs:
  python:
    name: Lint, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt

  lint:
    name: Lint workflows, scripts and Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: hadolint
        run: docker run --rm --interactive hadolint/hadolint:v2.15.1 < Dockerfile

  infrastructure:
    name: Validate OpenTofu (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cloud: [azure, gcp]
    defaults:
      run:
        working-directory: infra/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Validate
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate

  security:
    name: Scan Dockerfile and OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  container:
    name: Build, smoke test and scan image
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --detach --name smoke --publish 8000:8000 "$IMAGE"
          trap 'docker rm --force smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if body="$(curl --fail --silent http://127.0.0.1:8000/health)"; then
              version="$(jq -r .version <<<"$body")"
              if [ "$version" = "$EXPECTED_VERSION" ]; then
                echo "Healthy and serving ${version}"
                exit 0
              fi
              echo "::error::The image reports version ${version}, expected ${EXPECTED_VERSION}"
              exit 1
            fi
            sleep 1
          done
          docker logs smoke
          echo "::error::The container did not become healthy"
          exit 1

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  release:
    name: Record release metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, lint, infrastructure, security, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write release metadata
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release-metadata
          jq --null-input \
            --arg repository "$REPOSITORY" --arg sha "$SHA" --arg ref "$REF" --arg run_id "$RUN_ID" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, sha: $sha, ref: $ref, workflow_run_id: $run_id, status: "validated", timestamp: $timestamp}' \
            > release-metadata/release.json
          cat release-metadata/release.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-${{ github.sha }}
          path: release-metadata/release.json
          retention-days: 90
