name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cluster to create (if needed) and deploy to
        required: true
        type: choice
        options: [gke, aks, eks]
      environment:
        description: GitHub Environment to deploy to (prod only from main)
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-kubernetes-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.cloud }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Creating a cluster for the first time takes 20 minutes or more
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.verify.outputs.url }}
    env:
      CLOUD: ${{ inputs.cloud }}
      DEPLOY_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
      RELEASE: multi-cloud-app
      NAMESPACE: multi-cloud-app
      CHART: deploy/helm/multi-cloud-app
      # Google Cloud (GKE)
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      # Azure (AKS); OpenTofu authenticates with the same GitHub OIDC token as azure/login
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_ACR_NAME: ${{ vars.AKS_ACR_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # AWS (EKS)
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_TF_STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Allow production deployments only from main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::prod can only be deployed from main (this run is on ${GITHUB_REF_NAME})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$CLOUD" in
            gke)
              variables=(GCP_PROJECT_ID GCP_REGION GCP_TF_STATE_BUCKET)
              secrets=(GCP_WORKLOAD_IDENTITY_PROVIDER:GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT:GCP_SERVICE_ACCOUNT) ;;
            aks)
              variables=(AKS_RESOURCE_GROUP AKS_ACR_NAME AZURE_LOCATION AZURE_TF_STATE_RESOURCE_GROUP
                AZURE_TF_STATE_STORAGE_ACCOUNT AZURE_TF_STATE_CONTAINER)
              secrets=(ARM_CLIENT_ID:AZURE_CLIENT_ID ARM_TENANT_ID:AZURE_TENANT_ID ARM_SUBSCRIPTION_ID:AZURE_SUBSCRIPTION_ID) ;;
            eks)
              variables=(AWS_REGION AWS_TF_STATE_BUCKET)
              secrets=(AWS_ROLE_ARN:AWS_ROLE_ARN) ;;
          esac
          missing=0
          for name in "${variables[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Variable ${name} is not set in the ${DEPLOY_ENV} environment"
              missing=1
            fi
          done
          # Each entry is the variable the secret arrives in, then the secret's name
          for pair in "${secrets[@]}"; do
            arrives_in="${pair%%:*}"
            if [ -z "${!arrives_in:-}" ]; then
              echo "::error::Secret ${pair#*:} is not set in the ${DEPLOY_ENV} environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Export OpenTofu variables
        run: |
          {
            echo "TF_VAR_environment=${DEPLOY_ENV}"
            case "$CLOUD" in
              gke)
                echo "TF_VAR_project_id=${GCP_PROJECT_ID}"
                echo "TF_VAR_region=${GCP_REGION}" ;;
              aks)
                echo "TF_VAR_resource_group_name=${AKS_RESOURCE_GROUP}"
                echo "TF_VAR_acr_name=${AKS_ACR_NAME}"
                echo "TF_VAR_location=${AZURE_LOCATION}" ;;
              eks)
                echo "TF_VAR_region=${AWS_REGION}" ;;
            esac
          } >> "$GITHUB_ENV"

      # Each cloud trusts the job's GitHub OIDC token; no keys are stored
      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gke'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: inputs.cloud == 'gke'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authenticate to Azure
        if: inputs.cloud == 'aks'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to AWS
        if: inputs.cloud == 'eks'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Initialize OpenTofu state
        working-directory: infra/${{ inputs.cloud }}
        run: |
          key="multi-cloud-${CLOUD}/${DEPLOY_ENV}"
          case "$CLOUD" in
            gke)
              tofu init -backend-config="bucket=${GCP_TF_STATE_BUCKET}" -backend-config="prefix=${key}" ;;
            aks)
              tofu init \
                -backend-config="resource_group_name=${AZURE_TF_STATE_RESOURCE_GROUP}" \
                -backend-config="storage_account_name=${AZURE_TF_STATE_STORAGE_ACCOUNT}" \
                -backend-config="container_name=${AZURE_TF_STATE_CONTAINER}" \
                -backend-config="key=${key}.tfstate" ;;
            eks)
              tofu init \
                -backend-config="bucket=${AWS_TF_STATE_BUCKET}" \
                -backend-config="key=${key}.tfstate" \
                -backend-config="region=${AWS_REGION}" ;;
          esac

      # The cluster and its registry: the first run creates them, later runs apply changes
      - name: Create or update the cluster
        working-directory: infra/${{ inputs.cloud }}
        run: |
          tofu apply -auto-approve
          echo "CLUSTER_NAME=$(tofu output -raw cluster_name)" >> "$GITHUB_ENV"

      - name: Build and push image
        working-directory: infra/${{ inputs.cloud }}
        run: |
          set -euo pipefail
          case "$CLOUD" in
            gke)
              repository="$(tofu output -raw repository)/multi-cloud-app"
              gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet ;;
            aks)
              repository="$(tofu output -raw registry)/multi-cloud-app"
              az acr login --name "$AKS_ACR_NAME" ;;
            eks)
              repository="$(tofu output -raw repository_url)"
              aws ecr get-login-password --region "$AWS_REGION" \
                | docker login --username AWS --password-stdin "${repository%%/*}" ;;
          esac
          echo "IMAGE_REPOSITORY=${repository}" >> "$GITHUB_ENV"
          # ECR tags are immutable, so a re-run for the same commit reuses its image
          if [ "$CLOUD" = eks ] && aws ecr describe-images --repository-name "${repository#*/}" \
              --image-ids "imageTag=${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "${repository}:${IMAGE_TAG} already exists"
            exit 0
          fi
          docker build --build-arg APP_VERSION="$IMAGE_TAG" --tag "${repository}:${IMAGE_TAG}" "$GITHUB_WORKSPACE"
          docker push "${repository}:${IMAGE_TAG}"

      - name: Get GKE credentials
        if: inputs.cloud == 'gke'
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.GCP_REGION }}

      - name: Get AKS or EKS credentials
        if: inputs.cloud != 'gke'
        run: |
          case "$CLOUD" in
            aks) az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$CLUSTER_NAME" --overwrite-existing ;;
            eks) aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" ;;
          esac

      - name: Install or upgrade the release
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" --create-namespace \
            --values "${CHART}/values-${CLOUD}.yaml" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set environment="$DEPLOY_ENV" \
            --wait --timeout 10m
          kubectl get pods,services --namespace "$NAMESPACE" --output wide

      - name: Verify the new pods are serving
        id: verify
        run: |
          set -euo pipefail
          service="$(kubectl get service --namespace "$NAMESPACE" \
            --selector "app.kubernetes.io/instance=${RELEASE}" --output jsonpath='{.items[0].metadata.name}')"
          kubectl port-forward --namespace "$NAMESPACE" "service/${service}" 18080:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if body="$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/health)"; then
              version="$(jq -r .version <<<"$body")"
              if [ "$version" = "$IMAGE_TAG" ]; then
                # The cloud load balancer can take a few minutes; report its address once it has one
                address=""
                for _ in $(seq 1 30); do
                  address="$(kubectl get service "$service" --namespace "$NAMESPACE" --output \
                    jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}')"
                  if [ -n "$address" ]; then break; fi
                  sleep 10
                done
                url="${address:+http://${address}}"
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                {
                  echo "### Deployed to ${CLOUD} (${DEPLOY_ENV})"
                  echo "- Cluster: ${CLUSTER_NAME}"
                  echo "- URL: ${url:-load balancer still provisioning; see kubectl get service}"
                  echo "- Version: \`${version}\`"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Attempt ${attempt}: still serving ${version}"
            else
              echo "Attempt ${attempt}: not healthy yet"
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/port-forward.log"
          echo "::error::The release did not serve version ${IMAGE_TAG}"
          exit 1
