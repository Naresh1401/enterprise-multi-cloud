# What infra/aks outputs as helm_values, with example values; CI renders it on top of
# values-aks.yaml to check the chart as AKS runs it
serviceAccount:
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-00000000a001
database:
  enabled: true
  host: examplepg-pg.postgres.database.azure.com
  name: app
  user: app_user
  migrations:
    user: multi-cloud-dev-migrate
    appPrincipalId: 00000000-0000-0000-0000-00000000b001
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-00000000a002
  egress:
    to:
      - ipBlock:
          cidr: 10.60.8.0/24
