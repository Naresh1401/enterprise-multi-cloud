{{- if and .Values.database.enabled .Values.database.migrations.enabled }}
# A hook like the Job, so it exists before the Job on the first install
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.migrationName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.database.migrations.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
