# Defaults for any cluster; values-gke.yaml, values-aks.yaml and values-eks.yaml add each cloud's
# load balancer settings.

image:
  # The deploy workflow sets the registry repository and the commit SHA as the tag
  repository: multi-cloud-app
  tag: ""
  pullPolicy: IfNotPresent

# APP_ENV inside the container
environment: dev

# Used when autoscaling is off
replicaCount: 2

containerPort: 8000

service:
  type: ClusterIP
  port: 80
  annotations: {}
  # For example eks.amazonaws.com/nlb on EKS Auto Mode
  loadBalancerClass: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

serviceAccount:
  create: true
  # Defaults to the release's full name
  name: ""
  # For workload identity, for example iam.gke.io/gcp-service-account or eks.amazonaws.com/role-arn
  annotations: {}

podAnnotations: {}

# Extra labels on the service's pods, for example azure.workload.identity/use on AKS
podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Lets traffic in on the HTTP port only, and out only to DNS, the database and extraEgress
networkPolicy:
  enabled: true
  # More egress rules for the service and its migration job, for example to the cloud's
  # identity endpoint; values-<cloud>.yaml sets them
  extraEgress: []

# PostgreSQL; see docs/database.md. Off by default, and the service then runs without a database.
# The deploy workflow turns it on with the values that OpenTofu outputs for the cluster's database.
database:
  enabled: false
  # aws-iam, gcp-iam or azure-entra; password for local clusters and CI
  auth: ""
  host: ""
  port: 5432
  # gcp-iam: the Cloud SQL instance connection name, project:region:instance
  instance: ""
  name: app
  # The role the service signs in as
  user: app_user
  sslMode: verify-full
  # aws-iam: the database's region
  region: ""
  # password: a Secret with the service's password under the key "password"
  existingSecret: ""
  # More DB_* settings from docs/database.md, for example DB_POOL_SIZE: "4"
  extraEnv: {}
  # Where the pods may open database connections; an empty list allows any address
  egress:
    to: []
    ports: [5432]

  # A Job that runs `python -m app.migrate` before every install and upgrade, with its own
  # service account, so only it holds the identity that can change the schema
  migrations:
    enabled: true
    # How the job signs in; empty uses database.auth
    auth: ""
    # The administrator or migration role
    user: ""
    # password: a Secret with the administrator's password under the key "password"
    existingSecret: ""
    # AWS: the Secrets Manager secret in which RDS keeps the administrator's password
    passwordSecretArn: ""
    # azure-entra: the object ID of the service's managed identity
    appPrincipalId: ""
    serviceAccount:
      # For workload identity, as for serviceAccount.annotations
      annotations: {}
    podLabels: {}
    # More egress rules for the job only, for example to Secrets Manager on AWS
    extraEgress: []
    backoffLimit: 1
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Spread replicas across zones where the cluster has several
topologySpread:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# Image for the `helm test` connection check
testImage: busybox:1.37
